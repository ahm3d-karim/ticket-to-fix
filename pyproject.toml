[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
fde = "fde.cli:main"

[tool.setuptools]
packages = ["fde"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest"]
